<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__BRAND__ · {{ user.username }}</title>
    <!-- بوت MRM — پیش از باندل (Vite باندل را بعد از این نقطه می‌نشاند):
         ۱) واکشی تنظیمات در حین پارس HTML شروع می‌شود (موازی با ارزیابی باندل).
         ۲) تا لحظه‌ای که runtime تنظیمات را اِعمال کند، صفحه پنهان است. این کار
            «رندر با حالت اشتباه و بعد اصلاح» را حذف می‌کند؛ همان ریشهٔ پرشِ
            ~۱۷۰پیکسلی و پرشِ تم/برند در اولین رنگ (CLS 0.05 روی دسکتاپ).
         ۳) قاعدهٔ پنهان‌سازیِ بخش کانفیگ‌ها/اتصال سریع از همان ابتدا در CSS
            حاضر است تا کارتِ خاموش‌شدهٔ ادمین هرگز رندر نشود. -->
    <style id="mrm-runtime-boot-style">
html[data-mrm-booting="1"] body>*:not(#mrm-boot-screen):not(script):not(style){visibility:hidden!important}
html[data-mrm-boot-dark] #mrm-boot-screen{background:#0b0f0e}
html[data-mrm-boot-dark] #mrm-boot-screen span{border-color:rgba(245,247,246,.14);border-top-color:#59E0D8}
#mrm-boot-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f4f6f5}
#mrm-boot-screen span{width:28px;height:28px;border:2px solid rgba(20,40,38,.16);border-top-color:#2DB7B2;border-radius:999px;animation:mrmBootSpin .72s linear infinite}
@keyframes mrmBootSpin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){
#mrm-boot-screen{background:#0b0f0e}
#mrm-boot-screen span{border-color:rgba(245,247,246,.14);border-top-color:#59E0D8}}
@media(prefers-reduced-motion:reduce){
#mrm-boot-screen span{animation:none}}
html.mrm-hide-connections [data-ui="configs"],html.mrm-hide-connections #connection-links,html.mrm-hide-connections .treasury-links-section,html.mrm-hide-connections [data-ui="quick-connect"],html.mrm-hide-connections .treasury-quick-action,html.mrm-hide-connections .treasury-quick-main{display:none!important}
    </style>
    <script id="mrm-runtime-boot-script">
      (() => {
        const root = document.documentElement;
        root.setAttribute('data-mrm-booting', '1');
        /* تم ذخیره‌شدهٔ کاربر را از پلهٔ اول رعایت کن تا صفحهٔ بوت با تم نهایی
           هم‌رنگ باشد (نه فلاش سفید روی تم تاریک). */
        try {
          const saved = localStorage.getItem('mrm-theme') || '';
          if (/dark/i.test(saved)) root.setAttribute('data-mrm-boot-dark', '1');
        } catch (_) {}

        const reveal = () => {
          try {
            root.removeAttribute('data-mrm-booting');
            document.getElementById('mrm-boot-screen')?.remove();
          } catch (_) {}
        };
        window.__mrmFinishBoot = reveal;

        const mountScreen = () => {
          if (document.getElementById('mrm-boot-screen')) return;
          const node = document.createElement('div');
          node.id = 'mrm-boot-screen';
          node.setAttribute('aria-label', 'در حال بارگذاری');
          node.innerHTML = '<span aria-hidden="true"></span>';
          (document.body || root).appendChild(node);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountScreen, { once: true });
        else mountScreen();

        const route = location.pathname.endsWith('/') ? location.pathname.slice(0, -1) : location.pathname;
        if (!route || route === '/') { reveal(); return; }

        let pending;
        try {
          const controller = new AbortController();
          const deadline = setTimeout(() => controller.abort(), 6500);
          pending = fetch(location.origin + route + '/raw', {
            headers: { Accept: 'application/json' }, cache: 'no-store', signal: controller.signal,
          }).then((response) => {
            if (!response.ok) throw new Error('raw ' + response.status);
            return response.json();
          }).finally(() => clearTimeout(deadline));
        } catch (_) {
          reveal();
          return;
        }
        window.__mrmRawPromise = pending;
        pending.then((data) => {
          try {
            const headers = (data && data.headers) || (data && data.body && data.body.headers) || {};
            const read = (key) => {
              const value = headers['x-mrm-' + key] != null ? headers['x-mrm-' + key] : headers[key];
              return value == null ? '' : String(value).trim().toLowerCase();
            };
            if (read('enabled') === 'false') return;
            /* فقط تصمیمِ قطعی: کانفیگ‌ها خاموش‌اند و WireGuard روشن نشده است.
               ترکیب «کانفیگ خاموش + WireGuard روشن» به دادهٔ SSR/DOM نیاز دارد؛
               runtime بعد از ساخت DOM همان را قطعی می‌کند. */
            if (read('show-configs') === 'false' && read('show-wireguard') !== 'true') {
              root.classList.add('mrm-hide-connections');
            }
          } catch (_) {}
        }).catch(() => {});

        /* شبکهٔ ایمنی: صفحه هرگز پشت صفحهٔ بوت گیر نکند.
           - اگر runtime نصب/تزریق نشده باشد، روی DOMContentLoaded آزاد می‌شود.
           - اگر runtime باشد ولی دیر برسد، ۲.۵ ثانیه بعد از load آزاد می‌شود.
           - سقف مطلق: ۹ ثانیه. */
        document.addEventListener('DOMContentLoaded', () => {
          if (!document.getElementById('mrm-runtime-inline')) reveal();
        }, { once: true });
        window.addEventListener('load', () => {
          setTimeout(() => { if (root.hasAttribute('data-mrm-booting')) reveal(); }, 2500);
        }, { once: true });
        setTimeout(() => { if (root.hasAttribute('data-mrm-booting')) reveal(); }, 9000);
      })();
    </script>
    <!-- اعلان ادمین از سرور می‌آید (پنل آن را در همین رندر دارد). اگر از پلهٔ
         اول رندر شود، بنر بعد از بارگذاری روی صفحه نمی‌پرد؛ پیش‌تر runtime آن را
         با تأخیر تزریق می‌کرد و کل صفحه ~۳۶۰px جابه‌جا می‌شد (CLS 0.41).
         tojson مقادیر را برای درج امن داخل JSON اَسکیپ می‌کند. -->
    <script id="mrm-ssr-announce" type="application/json">{"text":{{ (announce or '')|tojson }},"url":{{ (announce_url or '')|tojson }}}</script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const obj = {
          user: {% if user %}{% set user_data = {
            'id': user.id,
            'username': user.username,
            'status': user.status.name if user.status else 'active',
            'used_traffic': user.used_traffic,
            'lifetime_used_traffic': user.lifetime_used_traffic,
            'data_limit': user.data_limit,
            'data_limit_reset_strategy': user.data_limit_reset_strategy.name if user.data_limit_reset_strategy else 'no_reset',
            'expire': user.expire.isoformat() if user.expire else None,
            'on_hold_expire_duration': user.on_hold_expire_duration,
            'on_hold_timeout': user.on_hold_timeout.isoformat() if user.on_hold_timeout else None,
            'group_ids': user.group_ids,
            'created_at': user.created_at.isoformat() if user.created_at else None,
            'edit_at': user.edit_at.isoformat() if user.edit_at else None,
            'online_at': user.online_at.isoformat() if user.online_at else None,
            'proxy_settings': {
              'vmess': {'id': user.proxy_settings.vmess.id|string} if user.proxy_settings.vmess else None,
              'vless': {'id': user.proxy_settings.vless.id|string, 'flow': user.proxy_settings.vless.flow.name if user.proxy_settings.vless.flow else None} if user.proxy_settings.vless else None,
              'trojan': {'password': user.proxy_settings.trojan.password} if user.proxy_settings.trojan else None,
              'shadowsocks': {'password': user.proxy_settings.shadowsocks.password, 'method': user.proxy_settings.shadowsocks.method.name if user.proxy_settings.shadowsocks.method else None} if user.proxy_settings.shadowsocks else None,
              'wireguard': {'public_key': user.proxy_settings.wireguard.public_key, 'peer_ips': user.proxy_settings.wireguard.peer_ips} if user.proxy_settings.wireguard else None,
              'hysteria': {'auth': user.proxy_settings.hysteria.auth|string} if user.proxy_settings.hysteria else None
            },
            'next_plan': {
              'user_template_id': user.next_plan.user_template_id,
              'data_limit': user.next_plan.data_limit,
              'expire': user.next_plan.expire,
              'add_remaining_traffic': user.next_plan.add_remaining_traffic
            } if user.next_plan else None
          } %}{{ user_data | tojson | safe }}{% else %}null{% endif %},
          links: {{ links | tojson | safe }},
          apps: {% if apps %}{% set apps_data = [] %}{% for app in apps %}{% if app %}{% set download_links_data = [] %}{% for link in app.download_links %}{% if link %}{% set link_dict = {
            'name': link.name,
            'url': link.url,
            'language': link.language
          } %}{% set _ = download_links_data.append(link_dict) %}{% endif %}{% endfor %}{% set app_dict = {
            'name': app.name,
            'icon_url': app.icon_url,
            'import_url': app.import_url,
            'description': app.description,
            'recommended': app.recommended,
            'platform': app.platform,
            'download_links': download_links_data
          } %}{% set _ = apps_data.append(app_dict) %}{% endif %}{% endfor %}{{ apps_data | tojson | safe }}{% else %}null{% endif %},
        };

        window.__INITIAL_DATA__ = obj;
      } catch (e) {
        console.warn("❌ Failed to load initial data:", e);
        window.__INITIAL_DATA__ = {};
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
